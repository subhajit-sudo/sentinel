<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#83B740"/>
      <stop offset="50%" style="stop-color:#B5DC82"/>
      <stop offset="100%" style="stop-color:#83B740"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#83B740;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#83B740;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#83B740;stop-opacity:0"/>
    </linearGradient>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Animated grid -->
  <g opacity="0.08">
    <line x1="0" y1="60" x2="900" y2="60" stroke="#83B740" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#83B740" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="900" y2="180" stroke="#83B740" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#83B740" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="300" stroke="#83B740" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#83B740" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="300" stroke="#83B740" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#83B740" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="300" stroke="#83B740" stroke-width="0.5"/>
  </g>

  <!-- Animated scan line -->
  <rect x="0" y="-30" width="900" height="30" fill="url(#scanline)">
    <animate attributeName="y" from="-30" to="300" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <circle cx="100" cy="80" r="1.5" fill="#83B740" opacity="0.6">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="220" r="1" fill="#B5DC82" opacity="0.4">
    <animate attributeName="cy" values="220;200;220" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="100" r="1.5" fill="#83B740" opacity="0.5">
    <animate attributeName="cy" values="100;80;100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="200" r="1" fill="#B5DC82" opacity="0.3">
    <animate attributeName="cy" values="200;180;200" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="50" r="1" fill="#83B740" opacity="0.4">
    <animate attributeName="cy" values="50;35;50" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="250" r="1.5" fill="#B5DC82" opacity="0.5">
    <animate attributeName="cy" values="250;230;250" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Shield icon -->
  <g transform="translate(450, 105) scale(1.1)" filter="url(#softGlow)">
    <path d="M0-40 L30-28 L30 5 Q30 30 0 45 Q-30 30-30 5 L-30-28 Z" fill="none" stroke="#83B740" stroke-width="2.5" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M-10 5 L-3 12 L12-5" fill="none" stroke="#B5DC82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Title text -->
  <text x="450" y="190" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="url(#glow)" text-anchor="middle" filter="url(#glowFilter)" letter-spacing="6">
    SENTINEL
  </text>

  <!-- Subtitle -->
  <text x="450" y="222" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle" letter-spacing="8">
    WEB SECURITY ASSESSMENT DASHBOARD
  </text>

  <!-- Version badge -->
  <rect x="403" y="238" rx="10" ry="10" width="94" height="22" fill="#83B740" opacity="0.15" stroke="#83B740" stroke-width="0.8"/>
  <text x="450" y="254" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#B5DC82" text-anchor="middle" font-weight="600" letter-spacing="2">
    VERSION 1.0
  </text>

  <!-- Bottom accent line -->
  <line x1="250" y1="278" x2="650" y2="278" stroke="#83B740" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Corner accents -->
  <path d="M15 15 L15 40" stroke="#83B740" stroke-width="1.5" opacity="0.4"/>
  <path d="M15 15 L40 15" stroke="#83B740" stroke-width="1.5" opacity="0.4"/>
  <path d="M885 15 L885 40" stroke="#83B740" stroke-width="1.5" opacity="0.4"/>
  <path d="M885 15 L860 15" stroke="#83B740" stroke-width="1.5" opacity="0.4"/>
  <path d="M15 285 L15 260" stroke="#83B740" stroke-width="1.5" opacity="0.4"/>
  <path d="M15 285 L40 285" stroke="#83B740" stroke-width="1.5" opacity="0.4"/>
  <path d="M885 285 L885 260" stroke="#83B740" stroke-width="1.5" opacity="0.4"/>
  <path d="M885 285 L860 285" stroke="#83B740" stroke-width="1.5" opacity="0.4"/>

  <!-- Pulse ring around shield -->
  <circle cx="450" cy="85" r="55" fill="none" stroke="#83B740" stroke-width="0.8" opacity="0">
    <animate attributeName="r" values="45;65" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="85" r="55" fill="none" stroke="#83B740" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="45;75" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
  </circle>
</svg>

