<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  <rect width="900" height="120" fill="url(#fbg)"/>

  <!-- Top accent -->
  <line x1="200" y1="15" x2="700" y2="15" stroke="#83B740" stroke-width="0.8" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Text -->
  <text x="450" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle" letter-spacing="3">
    DESIGNED &amp; DEVELOPED BY
  </text>
  <text x="450" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#B5DC82" text-anchor="middle" font-weight="700" letter-spacing="4">
    SUBHAJIT
  </text>

  <!-- Bottom line -->
  <line x1="350" y1="98" x2="550" y2="98" stroke="#83B740" stroke-width="0.8" opacity="0.3"/>

  <!-- Floating dots -->
  <circle cx="300" cy="60" r="1" fill="#83B740" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="55" r="1" fill="#83B740" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>

